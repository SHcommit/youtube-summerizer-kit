name: CD Release & PyPI Publish

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v0.1.0, v0.2.0

jobs:
  release:
    name: Build, Verify and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build '.[youtube,dev,telemetry,server]'

      - name: Validate release version state
        run: python scripts/check_release_consistency.py --tag "${GITHUB_REF#refs/tags/}"

      - name: Run verification suite
        run: |
          ruff check .
          mypy src/chew
          pytest -q

      - name: Build binary wheels and source tarball
        run: python -m build

      - name: Smoke test the release wheel
        run: |
          python -m venv /tmp/chew-release-test
          /tmp/chew-release-test/bin/pip install dist/*.whl
          /tmp/chew-release-test/bin/chew --help

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish package to PyPI (if PYPI_API_TOKEN is set)
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - name: Update Homebrew Formula (if HOMEBREW_TAP_TOKEN is set)
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Updating Homebrew Formula for tag: $TAG_NAME"
          # Automation step for homebrew-tap sync
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

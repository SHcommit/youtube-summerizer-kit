name: CI & AI Harness Monitor

on:
  push:
    branches: [ master, main, develop, "feature/*" ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      # mypy checks every module under src/chew, including the optional HTTP server.
      - run: pip install build '.[youtube,dev,telemetry,server]'
      - run: ruff check .
      - run: mypy src/chew

      - name: Run Pytest with Automatic Retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: pytest -q

      - run: python -m build

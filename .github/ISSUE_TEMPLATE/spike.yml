name: Spike / research
description: Time-box uncertainty before committing to implementation.
title: "[Spike] "
labels: ["kind:spike", "status:needs-triage"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What decision or unknown should this spike resolve?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Time box, cost limits, live-provider limits, or non-goals.
  - type: textarea
    id: output
    attributes:
      label: Expected output
      description: Usually a short report, ADR recommendation, benchmark result, or implementation plan.
    validations:
      required: true

# actions/labeler@v5 requires each label to contain match objects.
# Use only labels that already exist in this repository.
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'
          - 'assets/**'
          - 'modules/**'

github_actions:
  - changed-files:
      - any-glob-to-any-file: '.github/**'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'pyproject.toml'
          - 'uv.lock'
